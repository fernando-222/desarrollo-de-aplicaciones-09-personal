<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Micro-Framework Sass</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <div class="contenedor">

        <h1 class="titulo">
            Micro-Framework CSS con Sass
        </h1>


        <!-- Grilla -->
        <div class="fila">

            <div class="columna">
                <div class="tarjeta primario">
                    <h2>Primario</h2>
                    <p>
                        Componente con tema primario.
                    </p>
                </div>
            </div>

            <div class="columna">
                <div class="tarjeta secundario">
                    <h2>Secundario</h2>
                    <p>
                        Componente con tema secundario.
                    </p>
                </div>
            </div>

            <div class="columna">
                <div class="tarjeta acento">
                    <h2>Acento</h2>
                    <p>
                        Componente con tema de acento.
                    </p>
                </div>
            </div>

        </div>


        <!-- Botones -->
        <div class="tarjeta">

            <h2>Botones</h2>

            <button class="btn-primario">
                Primario
            </button>

            <button class="btn-secundario">
                Secundario
            </button>

            <button class="btn-acento">
                Acento
            </button>

            <button class="btn-peligro">
                Peligro
            </button>

            <button class="btn-advertencia">
                Advertencia
            </button>

        </div>


        <!-- Temas -->
        <div class="fila">

            <div class="columna">
                <div class="tarjeta peligro">
                    <h2>Peligro</h2>
                    <p>
                        Este componente utiliza el tema peligro.
                    </p>
                </div>
            </div>

            <div class="columna">
                <div class="tarjeta advertencia">
                    <h2>Advertencia</h2>
                    <p>
                        Este componente utiliza el tema advertencia.
                    </p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
