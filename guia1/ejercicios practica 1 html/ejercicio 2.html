<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Formulario de Registro</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        form {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #202a36;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #34495e;
        }

    </style>

</head>

<body>

    <form>

        <h1>Registro</h1>

        <label for="nombre">Nombre:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Ingrese solamente letras"
            required>

        <label for="correo">Correo electrónico:</label>
        <input
            type="email"
            id="correo"
            name="correo"
            required>

        <label for="contrasena">Contraseña:</label>
        <input
            type="password"
            id="contrasena"
            name="contrasena"
            minlength="8"
            maxlength="20"
            required
            title="La contraseña debe tener entre 8 y 20 caracteres">

        <label for="telefono">Número de teléfono:</label>
        <input
            type="tel"
            id="telefono"
            name="telefono"
            pattern="[0-9]{9}"
            title="Ingrese un número de teléfono de 9 dígitos"
            required>

        <label for="edad">Edad:</label>
        <input
            type="number"
            id="edad"
            name="edad"
            min="18"
            max="100"
            required>

        <button type="submit">Registrarse</button>

    </form>

</body>

</html>
