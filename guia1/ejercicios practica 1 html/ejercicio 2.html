<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Formulario de Registro</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        form {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background-color: #202a36;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #34495e;
        }

    </style>

</head>

<body>

    <form>

        <h1>Registro</h1>

        <!-- Campo para ingresar el nombre -->
        <label for="nombre">Nombre:</label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingrese su nombre completo"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            title="Ingrese solamente letras"
            required>

        <!-- Campo para ingresar el correo -->
        <label for="correo">Correo electrónico:</label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required>

        <!-- Campo para ingresar la contraseña -->
        <label for="contrasena">Contraseña:</label>

        <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Ingrese entre 8 y 20 caracteres"
            minlength="8"
            maxlength="20"
            required
            title="La contraseña debe tener entre 8 y 20 caracteres">

        <!-- Campo para ingresar el número de teléfono -->
        <label for="telefono">Número de teléfono:</label>

        <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Ingrese 9 dígitos"
            pattern="[0-9]{9}"
            title="Ingrese un número de teléfono de 9 dígitos"
            required>

        <!-- Campo para ingresar la edad -->
        <label for="edad">Edad:</label>

        <input
            type="number"
            id="edad"
            name="edad"
            placeholder="Ingrese su edad"
            min="18"
            max="100"
            required>

        <!-- Campo para seleccionar el género -->
        <label for="genero">Género:</label>

        <select id="genero" name="genero" required>
            <option value="">Seleccione una opción</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="otro">Otro</option>
            <option value="prefiero_no_decirlo">Prefiero no decirlo</option>
        </select>

        <!-- Campo para seleccionar la fecha de nacimiento -->
        <label for="fecha">Fecha de nacimiento:</label>

        <input
            type="date"
            id="fecha"
            name="fecha"
            required>

        <!-- Botón para enviar el formulario -->
        <button type="submit">Registrarse</button>

    </form>

</body>

</html>
